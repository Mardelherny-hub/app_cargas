name: Desconsolidados Argentina CI

on:
  push:
    branches:
      - feat/desconsolidados-argentina-e2e
  pull_request:
    paths:
      - 'app/Http/Controllers/Company/Simple/ArgentinaDeconsolidatedController.php'
      - 'app/Http/Controllers/Company/Simple/LegacyDeconsolidationRedirectController.php'
      - 'app/Models/Container.php'
      - 'app/Services/Simple/ArgentinaDeconsolidatedService.php'
      - 'app/Services/Webservice/CertificateManagerService.php'
      - 'app/Services/Webservice/Argentina/SimpleXmlGeneratorDesconsolidado.php'
      - 'database/migrations/2026_09_08_200500_add_acep_to_containers_table.php'
      - 'resources/views/company/simple/desconsolidado/show.blade.php'
      - 'routes/company_desconsolidado.php'
      - 'routes/web.php'
      - 'tests/Feature/ArgentinaDeconsolidatedRoutesTest.php'
      - 'tests/Unit/Services/Webservice/ArgentinaDeconsolidatedPersistenceContractTest.php'
      - 'tests/Unit/Services/Webservice/ArgentinaDeconsolidatedServiceContractTest.php'
      - 'tests/Unit/Services/Webservice/ArgentinaDeconsolidatedXmlStructureTest.php'

jobs:
  contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, soap, openssl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
          php artisan key:generate --force

      - name: PHP syntax checks
        run: |
          php -l app/Http/Controllers/Company/Simple/ArgentinaDeconsolidatedController.php
          php -l app/Http/Controllers/Company/Simple/LegacyDeconsolidationRedirectController.php
          php -l app/Models/Container.php
          php -l app/Services/Simple/ArgentinaDeconsolidatedService.php
          php -l app/Services/Webservice/CertificateManagerService.php
          php -l app/Services/Webservice/Argentina/SimpleXmlGeneratorDesconsolidado.php
          php -l database/migrations/2026_09_08_200500_add_acep_to_containers_table.php
          php -l routes/company_desconsolidado.php
          php -l routes/web.php
          php -l tests/Feature/ArgentinaDeconsolidatedRoutesTest.php
          php -l tests/Unit/Services/Webservice/ArgentinaDeconsolidatedPersistenceContractTest.php
          php -l tests/Unit/Services/Webservice/ArgentinaDeconsolidatedServiceContractTest.php
          php -l tests/Unit/Services/Webservice/ArgentinaDeconsolidatedXmlStructureTest.php

      - name: Laravel route cache check
        run: |
          php artisan route:clear
          php artisan route:cache
          php artisan route:list --name=company.simple.desconsolidado
          php artisan route:list --name=company.deconsolidation
          php artisan route:clear

      - name: Blade compile check
        run: |
          php artisan view:clear
          php artisan view:cache
          php artisan view:clear

      - name: Persistence contract tests
        run: php artisan test tests/Unit/Services/Webservice/ArgentinaDeconsolidatedPersistenceContractTest.php

      - name: Service contract tests
        run: php artisan test tests/Unit/Services/Webservice/ArgentinaDeconsolidatedServiceContractTest.php

      - name: XML structure tests
        run: php artisan test tests/Unit/Services/Webservice/ArgentinaDeconsolidatedXmlStructureTest.php

      - name: Canonical and legacy route tests
        run: php artisan test tests/Feature/ArgentinaDeconsolidatedRoutesTest.php
