name: Validate smoke imports

on:
  push:
    branches:
      - fix/smoke-imports-2026-09-14
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, curl, zip, gd, intl, soap
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: PHP syntax check
        run: |
          git diff --name-only origin/main...HEAD -- '*.php' \
            | while IFS= read -r file; do
                [ -f "$file" ] || continue
                php -l "$file"
              done

      - name: Load BillOfLadingControllerCompat
        run: |
          php -r 'require "vendor/autoload.php"; exit(class_exists("App\\Http\\Controllers\\Company\\BillOfLadingControllerCompat") ? 0 : 1);'

      - name: Load ShipmentItemControllerCompat
        run: |
          php -r 'require "vendor/autoload.php"; exit(class_exists("App\\Http\\Controllers\\Company\\ShipmentItemControllerCompat") ? 0 : 1);'

      - name: Load CmspEdiParserCompat
        run: |
          php -r 'require "vendor/autoload.php"; exit(class_exists("App\\Services\\Parsers\\CmspEdiParserCompat") ? 0 : 1);'

      - name: Load G2OceanXmlParserCompat
        run: |
          php -r 'require "vendor/autoload.php"; exit(class_exists("App\\Services\\Parsers\\G2OceanXmlParserCompat") ? 0 : 1);'

      - name: Load GuaranExcelParserCompat
        run: |
          php -r 'require "vendor/autoload.php"; exit(class_exists("App\\Services\\Parsers\\GuaranExcelParserCompat") ? 0 : 1);'

      - name: Load KlineDataParserCompat
        run: |
          php -r 'require "vendor/autoload.php"; exit(class_exists("App\\Services\\Parsers\\KlineDataParserCompat") ? 0 : 1);'

      - name: Load LoginXmlParserCompat
        run: |
          php -r 'require "vendor/autoload.php"; exit(class_exists("App\\Services\\Parsers\\LoginXmlParserCompat") ? 0 : 1);'

      - name: Load NavsurTextParserCompat
        run: |
          php -r 'require "vendor/autoload.php"; exit(class_exists("App\\Services\\Parsers\\NavsurTextParserCompat") ? 0 : 1);'

      - name: Load ParanaExcelParserCompat
        run: |
          php -r 'require "vendor/autoload.php"; exit(class_exists("App\\Services\\Parsers\\ParanaExcelParserCompat") ? 0 : 1);'

      - name: Load ManifestParserFactory
        run: |
          php -r 'require "vendor/autoload.php"; exit(class_exists("App\\Services\\Parsers\\ManifestParserFactory") ? 0 : 1);'

      - name: Load ProcessManifestImportJob
        run: |
          php -r 'require "vendor/autoload.php"; exit(class_exists("App\\Jobs\\ProcessManifestImportJob") ? 0 : 1);'

      - name: Bootstrap Laravel routes
        run: php artisan route:list >/dev/null

      - name: Verify BillOfLading controller binding
        run: |
          php -r '
          $app = require "bootstrap/app.php";
          $app->make(Illuminate\\Contracts\\Console\\Kernel::class)->bootstrap();
          $controller = $app->make(App\\Http\\Controllers\\Company\\BillOfLadingController::class);
          exit($controller instanceof App\\Http\\Controllers\\Company\\BillOfLadingControllerCompat ? 0 : 1);
          '

      - name: Verify ShipmentItem controller binding
        run: |
          php -r '
          $app = require "bootstrap/app.php";
          $app->make(Illuminate\\Contracts\\Console\\Kernel::class)->bootstrap();
          $controller = $app->make(App\\Http\\Controllers\\Company\\ShipmentItemController::class);
          exit($controller instanceof App\\Http\\Controllers\\Company\\ShipmentItemControllerCompat ? 0 : 1);
          '
