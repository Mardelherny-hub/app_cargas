name: Validate smoke imports

on:
  push:
    branches:
      - fix/smoke-imports-2026-09-14
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, curl, zip, gd, intl, soap
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: PHP syntax check
        run: |
          git diff --name-only origin/main...HEAD -- '*.php' \
            | while IFS= read -r file; do
                [ -f "$file" ] || continue
                php -l "$file"
              done

      - name: Load compatibility classes
        run: |
          php -r '
          require "vendor/autoload.php";
          $classes = [
            "App\\Http\\Controllers\\Company\\BillOfLadingControllerCompat",
            "App\\Http\\Controllers\\Company\\ShipmentItemControllerCompat",
            "App\\Services\\Parsers\\CmspEdiParserCompat",
            "App\\Services\\Parsers\\G2OceanXmlParserCompat",
            "App\\Services\\Parsers\\GuaranExcelParserCompat",
            "App\\Services\\Parsers\\KlineDataParserCompat",
            "App\\Services\\Parsers\\LoginXmlParserCompat",
            "App\\Services\\Parsers\\NavsurTextParserCompat",
            "App\\Services\\Parsers\\ParanaExcelParserCompat",
            "App\\Services\\Parsers\\ManifestParserFactory",
            "App\\Jobs\\ProcessManifestImportJob",
          ];
          foreach ($classes as $class) {
            if (!class_exists($class)) exit(1);
          }
          '

      - name: Bootstrap Laravel routes
        run: php artisan route:list >/dev/null

      - name: Capture controller binding diagnostics
        run: |
          php -r '
          require "vendor/autoload.php";
          $out = [];
          try {
              $app = require "bootstrap/app.php";
              $bill = "App\\Http\\Controllers\\Company\\BillOfLadingController";
              $item = "App\\Http\\Controllers\\Company\\ShipmentItemController";
              $out["bill_bound_before"] = $app->bound($bill);
              $out["item_bound_before"] = $app->bound($item);
              $out["bill_make_before"] = get_class($app->make($bill));
              $out["item_make_before"] = get_class($app->make($item));
              $app->make("Illuminate\\Contracts\\Console\\Kernel")->bootstrap();
              $out["bill_bound_after"] = $app->bound($bill);
              $out["item_bound_after"] = $app->bound($item);
              $out["bill_make_after"] = get_class($app->make($bill));
              $out["item_make_after"] = get_class($app->make($item));
          } catch (Throwable $e) {
              $out["exception"] = get_class($e) . ": " . $e->getMessage();
          }
          file_put_contents("binding-diagnostics.json", json_encode($out, JSON_PRETTY_PRINT));
          '
          cat binding-diagnostics.json

      - name: Upload controller binding diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: binding-diagnostics
          path: binding-diagnostics.json
          retention-days: 1

      - name: Verify controller bindings
        run: |
          php -r '
          $d = json_decode(file_get_contents("binding-diagnostics.json"), true);
          $ok = ($d["bill_make_after"] ?? null) === "App\\Http\\Controllers\\Company\\BillOfLadingControllerCompat"
             && ($d["item_make_after"] ?? null) === "App\\Http\\Controllers\\Company\\ShipmentItemControllerCompat";
          exit($ok ? 0 : 1);
          '
