name: Validate smoke imports

on:
  push:
    branches:
      - fix/smoke-imports-2026-09-14
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, curl, zip, gd, intl, soap
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: PHP syntax check
        run: |
          git diff --name-only origin/main...HEAD -- '*.php' \
            | while IFS= read -r file; do
                [ -f "$file" ] || continue
                php -l "$file"
              done

      - name: Load compatibility classes
        run: |
          php -r '
          require "vendor/autoload.php";
          $classes = [
            "App\\Http\\Controllers\\Company\\BillOfLadingControllerCompat",
            "App\\Http\\Controllers\\Company\\ShipmentItemControllerCompat",
            "App\\Services\\Parsers\\CmspEdiParserCompat",
            "App\\Services\\Parsers\\G2OceanXmlParserCompat",
            "App\\Services\\Parsers\\GuaranExcelParserCompat",
            "App\\Services\\Parsers\\KlineDataParserCompat",
            "App\\Services\\Parsers\\LoginXmlParserCompat",
            "App\\Services\\Parsers\\NavsurTextParserCompat",
            "App\\Services\\Parsers\\ParanaExcelParserCompat",
            "App\\Services\\Parsers\\ManifestParserFactory",
            "App\\Jobs\\ProcessManifestImportJob",
          ];
          foreach ($classes as $class) {
            if (!class_exists($class)) exit(1);
          }
          '

      - name: Bootstrap Laravel routes
        run: php artisan route:list >/dev/null

      - name: Verify BillOfLading binding exists
        run: |
          php -r '
          $app = require "bootstrap/app.php";
          $app->make("Illuminate\\Contracts\\Console\\Kernel")->bootstrap();
          exit($app->bound("App\\Http\\Controllers\\Company\\BillOfLadingController") ? 0 : 1);
          '

      - name: Verify BillOfLading controller resolution
        run: |
          php -r '
          $app = require "bootstrap/app.php";
          $app->make("Illuminate\\Contracts\\Console\\Kernel")->bootstrap();
          $controller = $app->make("App\\Http\\Controllers\\Company\\BillOfLadingController");
          exit(get_class($controller) === "App\\Http\\Controllers\\Company\\BillOfLadingControllerCompat" ? 0 : 1);
          '

      - name: Verify ShipmentItem binding exists
        run: |
          php -r '
          $app = require "bootstrap/app.php";
          $app->make("Illuminate\\Contracts\\Console\\Kernel")->bootstrap();
          exit($app->bound("App\\Http\\Controllers\\Company\\ShipmentItemController") ? 0 : 1);
          '

      - name: Verify ShipmentItem controller resolution
        run: |
          php -r '
          $app = require "bootstrap/app.php";
          $app->make("Illuminate\\Contracts\\Console\\Kernel")->bootstrap();
          $controller = $app->make("App\\Http\\Controllers\\Company\\ShipmentItemController");
          exit(get_class($controller) === "App\\Http\\Controllers\\Company\\ShipmentItemControllerCompat" ? 0 : 1);
          '
